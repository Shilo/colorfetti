<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Colorfetti GIF palette acceptance</title>
<style>body{margin:0;background:#e9edf0;color:#192028;font:14px system-ui}header{padding:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}button{font:inherit;padding:10px}iframe{display:block;width:100%;height:75vh;border:0;background:#fff}pre{margin:12px;white-space:pre-wrap;overflow-wrap:anywhere}a{color:#174aa6}</style>
<header><button id="run">Run GIF palette checks</button><strong id="status" role="status">Ready</strong><a href="/probe" target="_blank">Native background probe</a></header>
<iframe id="app" title="Unmodified production Colorfetti"></iframe><pre id="out"></pre>
<script type="module">
const iframe=document.querySelector('#app'),run=document.querySelector('#run'),status=document.querySelector('#status'),out=document.querySelector('#out');
const touch=new URL(location.href).searchParams.has('touch');
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));const assert=(ok,message)=>{if(!ok)throw Error(message);};
let w,d,report,manifest,artifacts,phase;
const all=(selector,root=d)=>[...root.querySelectorAll(selector)];
const label=(value,root=d)=>root.querySelector('[aria-label="'+CSS.escape(value)+'"]');
const textButton=(value,root=d)=>all('button',root).find(node=>node.textContent.trim()===value);
const click=node=>{assert(node,'Missing control in '+phase);assert(!node.disabled,'Disabled control '+(node.getAttribute('aria-label')||node.textContent));node.click();};
const input=(node,value,event='input')=>{assert(node,'Missing input');node.value=value;node.dispatchEvent(new w.Event(event,{bubbles:true}));};
async function until(test,message,timeout=25000){const started=performance.now();for(;;){const result=test();if(result)return result;assert(performance.now()-started<timeout,message);await sleep(30);}}
async function post(path,value){const response=await fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(value)}),result=await response.json();assert(response.ok,result.error||'HTTP failure');return result;}
async function publish(){out.textContent=JSON.stringify(report,null,2);await post('/report',report);}
async function check(name,action){phase=name;status.textContent=name;const started=performance.now(),result=await action();assert(!report.errors.length,'Runtime error: '+report.errors.join('; '));report.checks.push({name,pass:true,ms:Math.round(performance.now()-started),...result});await publish();}
function hook(){
  w.addEventListener('error',event=>{if(!String(event.message).startsWith('ResizeObserver loop'))report.errors.push(String(event.message));});
  w.addEventListener('unhandledrejection',event=>report.errors.push(String(event.reason)));
  const create=w.URL.createObjectURL.bind(w.URL);w.URL.createObjectURL=blob=>{const href=create(blob);artifacts.push({blob,href});return href;};
  const anchor=w.HTMLAnchorElement.prototype.click;w.HTMLAnchorElement.prototype.click=function(){if(this.download&&this.href.startsWith('blob:')){const artifact=artifacts.find(value=>value.href===this.href);if(artifact)artifact.name=this.download;return;}return anchor.call(this);};
}
async function boot(clean=false){
  if(clean){for(const key of Object.keys(localStorage))if(key==='colorfetti'||key.startsWith('colorfetti-')||key==='bitify'||key.startsWith('bitify-'))localStorage.removeItem(key);}
  await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('App frame load timeout')),25000);iframe.onload=()=>{clearTimeout(timer);resolve();};iframe.src='/app/?qa='+Date.now()+(touch?'&touch=1':'');});
  w=iframe.contentWindow;d=w.document;hook();await until(()=>d.querySelector('.dock'),'Production app did not initialize');await sleep(50);
  const close=d.querySelector('dialog[open] button[aria-label="Close"]');if(close)click(close);
  await until(()=>label('Palette settings'),'Production Palette controls did not initialize');
}
async function rail(){if(!d.querySelector('.palette-family-tabs'))click(label('Palette'));await until(()=>d.querySelector('.palette-family-tabs'),'Palette rail did not open');}
async function select(name){await rail();click(label(name));await until(()=>label(name)?.getAttribute('aria-pressed')==='true','Palette not selected '+name);}
async function editor(){await rail();click(label('Import palette'));await until(()=>d.querySelector('.palette-import-modal[open]'),'Import editor did not open');return d.querySelector('.palette-import-modal[open]');}
async function closeEditor(){click(label('Close palette editor'));await until(()=>!d.querySelector('.palette-import-modal[open]'),'Palette editor did not close');}
function editorColors(){return all('.palette-review-grid button').map(node=>node.getAttribute('aria-label').match(/#[\da-f]{6}/i)[0]);}
function editorCount(){return Number(d.querySelector('.palette-review-heading strong')?.textContent.replace(/[^\d]/g,''));}
async function editorReady(count){await until(()=>editorCount()===count&&!d.querySelector('.palette-import-progress')&&all('.palette-review-grid button').every(node=>!node.disabled),'Palette import did not settle at '+count+' colors');assert(!d.querySelector('.palette-editor-error'),'Palette error: '+d.querySelector('.palette-editor-error')?.textContent);}
async function file(key){const result=await fetch('/fixture/'+key),entry=manifest.files[key];return new w.File([await result.arrayBuffer()],entry.name,{type:entry.type});}
async function loadFile(inputNode,key){const transfer=new w.DataTransfer();transfer.items.add(await file(key));inputNode.files=transfer.files;inputNode.dispatchEvent(new w.Event('change',{bubbles:true}));await sleep(0);}
async function paletteFile(key,count){if(!d.querySelector('.palette-import-modal[open]'))await editor();click(textButton('Image or file'));await loadFile(d.querySelector('.palette-import-modal input[type=file]'),key);await editorReady(count);return editorColors();}
async function add(key){await loadFile(d.querySelector('input[type=file][multiple]'),key);await until(()=>tile(manifest.files[key].name),'Artwork import failed '+key);}
function tile(name){return all('.tiles > .tile').find(node=>node.querySelector('.name')?.textContent===name);}
async function caption(name,count){return until(()=>{const node=tile(name)?.querySelector('.caption-color-count');return node&&node.getAttribute('aria-busy')!=='true'&&node.textContent.trim()===count+' '+(count===1?'color':'colors')?node.textContent:null;},'Caption did not settle at '+count+' colors for '+name);}
async function clearWall(){for(const node of all('.tiles .acts button[aria-label^="Remove "]'))click(node);await until(()=>!all('.tiles .acts button[aria-label^="Remove "]').length,'Wall did not clear');}
function b64(bytes){let result='';for(let i=0;i<bytes.length;i+=4096)result+=String.fromCharCode(...bytes.subarray(i,i+4096));return btoa(result);}
async function verifyArtifact(artifact,mode='identity',maxColors,fixtureKey){return post('/verify',{name:artifact.name,type:artifact.blob.type,base64:b64(new Uint8Array(await artifact.blob.arrayBuffer())),mode,maxColors,fixtureKey});}
async function save(name,mode='identity',maxColors,fixtureKey){const start=artifacts.length;if(touch){click(label('Image actions for '+name));await until(()=>label('Image actions')?.open,'Touch image actions missing');click(textButton('Save',label('Image actions')));}else click(label('Save '+name));const artifact=await until(()=>artifacts.slice(start).find(value=>value.name&&(value.blob.type==='image/gif'||value.blob.type==='image/png')),'Image download not produced '+name);return verifyArtifact(artifact,mode,maxColors,fixtureKey);}
async function reuse(name){const button=label('Reuse colors from '+name);if(!touch&&button?.getClientRects().length)click(button);else{click(label('Image actions for '+name));await until(()=>label('Image actions')?.open,'Image action sheet missing');click(textButton('Reuse colors',label('Image actions')));}await until(()=>d.querySelector('.palette-import-modal[open]'),'Reuse editor missing');}
async function settings(name='Max colors'){if(!d.querySelector('.palette-settings-panel'))click(label('Palette settings'));await until(()=>d.querySelector('.palette-settings-panel'),'Palette settings missing');const chip=all('.palette-setting-chip').find(node=>node.getAttribute('aria-label')?.startsWith(name+':'));if(chip)click(chip);await sleep(0);}
async function setCap(value){await settings();if(value){const node=label('Max colors value');input(node,String(value));node.dispatchEvent(new w.Event('change',{bubbles:true}));}else click(label('Use all palette colors'));await until(()=>JSON.parse(w.localStorage.getItem('colorfetti')).maxColors===value,'Max colors did not commit');}
async function setOpacity(value){await settings('Opacity');click(textButton(value==='keep'?'Keep':'Cut',d.querySelector('.palette-settings-panel')));await until(()=>JSON.parse(w.localStorage.getItem('colorfetti')).alphaMode===value,'Opacity mode did not commit');}
function dimensions(name,expected){const actual=tile(name)?.querySelector('.caption-resolution')?.textContent.replace(/\s/g,'');assert(actual===expected.width+'×'+expected.height,'Wrong oriented dimensions for '+name+': '+actual);}
async function bitmapSourceCount(entry,reason){
  const bitmap=await w.createImageBitmap(await file(entry.key)),surface=d.createElement('canvas');
  try{
    surface.width=bitmap.width;surface.height=bitmap.height;const context=surface.getContext('2d',{willReadFrequently:true,colorSpace:'srgb'});context.drawImage(bitmap,0,0);
    const pixels=context.getImageData(0,0,bitmap.width,bitmap.height).data,colors=new Set();
    for(let p=0;p<pixels.length;p+=4)if(pixels[p+3])colors.add((pixels[p]<<16)|(pixels[p+1]<<8)|pixels[p+2]);
    return{count:colors.size,reference:'Independent browser bitmap/canvas sRGB fallback',reason};
  }finally{bitmap.close();surface.width=surface.height=0;}
}
async function browserSourceCount(entry,stream=true){
  if(typeof w.ImageDecoder==='undefined')return bitmapSourceCount(entry,'Native decoder unavailable');
  let decoder,image;
  try{
    const encoded=await file(entry.key);
    decoder=new w.ImageDecoder({data:stream?encoded.stream():await encoded.arrayBuffer(),type:entry.type,preferAnimation:false,colorSpaceConversion:'default'});
    image=(await decoder.decode({frameIndex:0,completeFramesOnly:true})).image;
    const space=image.colorSpace;
    if(['primaries','transfer','matrix','fullRange'].every(key=>space?.[key]==null))return bitmapSourceCount(entry,'Unknown native color space');
    const width=image.visibleRect.width,height=image.visibleRect.height,pixels=new Uint8Array(width*height*4),layout=[{offset:0,stride:width*4}];
    const packed=(image.format==='RGBA'||image.format==='BGRA')&&space.fullRange===true&&space.matrix==='rgb'&&space.primaries==='bt709'&&space.transfer==='iec61966-2-1';
    await image.copyTo(pixels,packed?{layout}:{format:'RGBA',colorSpace:'srgb',layout});
    const colors=new Set(),bgra=packed&&image.format==='BGRA';
    for(let p=0;p<pixels.length;p+=4)if(pixels[p+3])colors.add((pixels[p+(bgra?2:0)]<<16)|(pixels[p+1]<<8)|pixels[p+(bgra?0:2)]);
    return{count:colors.size,format:image.format,colorSpace:space.toJSON(),input:stream?'File stream':'ArrayBuffer',reference:'Harness browser-native managed sRGB; RGB union is orientation invariant'};
  }finally{image?.close();decoder?.close();}
}
async function generatedConvertedReady(name){
  await rail();
  return until(()=>{
    const edit=label('Edit palette'),caption=tile(name)?.querySelector('.caption-color-count'),count=caption?.textContent.trim();
    return label('Auto')?.getAttribute('aria-pressed')==='true'&&edit&&!edit.disabled&&!d.querySelector('.palette-source-status')&&
      caption?.getAttribute('aria-busy')!=='true'&&/^\d+ colors?$/.test(count||'')?count:null;
  },'Auto generation and converted caption did not settle for '+name);
}
async function rasterChecks(){
  const entries=manifest.stills??[],lowColor=entries.filter(entry=>entry.colors.length<=64);
  if(lowColor.length){
    await check('PNG, JPEG, BMP and lossless WebP preserve exact opaque RGB through Auto and Save',async()=>{
      const results=[];for(const entry of lowColor.filter(entry=>!entry.partialAlpha)){
        await clearWall();await select('Auto');await add(entry.key);await caption(entry.name,entry.colors.length);dimensions(entry.name,entry);
        results.push({name:entry.name,colors:entry.colors.length,export:await save(entry.name,'identity',undefined,entry.key)});
      }return{fixtures:results};
    });
    await check('Partial-alpha PNG and WebP Keep preserve independent source RGB and every alpha byte in saved PNG',async()=>{
      const results=[];for(const entry of lowColor.filter(entry=>entry.partialAlpha)){
        await clearWall();await select('Auto');await add(entry.key);await setOpacity('keep');await caption(entry.name,entry.colors.length);dimensions(entry.name,entry);
        results.push({name:entry.name,colors:entry.colors.length,export:await save(entry.name,'identity',undefined,entry.key)});
      }return{fixtures:results};
    });
    await check('Still-image palette imports match independent acquisition RGB sets without additional colors',async()=>{
      const results=[];for(const entry of lowColor){
        const expected=entry.colors;
        const colors=await paletteFile(entry.key,expected.length);assert(JSON.stringify(colors.sort())===JSON.stringify(expected),'Imported RGB differs from independent reference for '+entry.name);
        results.push({name:entry.name,colors:colors.length,expected});
      }await closeEditor();return{fixtures:results};
    });
  }
  const gradients=entries.filter(entry=>entry.colors.length>64);
  if(gradients.length)await check('Gradient, EXIF and profiled JPEG artwork retain oriented dimensions and browser-managed Original counts',async()=>{
    const results=[];for(const entry of gradients){
      const source=await browserSourceCount(entry);
      const buffered=await browserSourceCount(entry,false);
      await clearWall();await select('Auto');await add(entry.key);dimensions(entry.name,entry);
      const convertedCount=await generatedConvertedReady(entry.name);
      click(d.querySelector('.view-toggle'));if(source.count!==null)await caption(entry.name,source.count);
      assert(d.querySelector('.view-toggle').getAttribute('aria-pressed')==='false','Original view did not activate for '+entry.name);dimensions(entry.name,entry);
      results.push({name:entry.name,width:entry.width,height:entry.height,convertedCount,originalColors:source.count,nativeSource:source,bufferedNativeSource:buffered,reference:source.reference,independentReference:entry.reference,exifOrientation:entry.exifOrientation});
      click(d.querySelector('.view-toggle'));
    }return{fixtures:results,scope:'Original dimensions and browser-native sRGB count where available; independent JPEG/profile decoders may round differently; Auto intentionally limits high-color artwork'};
  });
}
async function malformedChecks(){
  await check('GIF graphics controls apply only to their following image in artwork, palette and Save',async()=>{
    const colors=await paletteFile('gceScope',2);assert(JSON.stringify(colors.sort())===JSON.stringify(['#0000ff','#ff0000']),'Missing-GCE palette omitted an opaque color');
    await closeEditor();await clearWall();await select('Auto');await add('gceScope');await caption(manifest.files.gceScope.name,2);
    return{colors:2,export:await save(manifest.files.gceScope.name,'identity',undefined,'gceScope')};
  });
  await check('Framed GIFs with short pixels or out-of-range indices retain palette draft and add no artwork',async()=>{
    await paletteFile('source',29);const before=editorColors(),paletteErrors=[];
    for(const key of ['malformedShort','malformedIndex']){
      await loadFile(d.querySelector('.palette-import-modal input[type=file]'),key);
      await until(()=>d.querySelector('.palette-editor-error')&&!d.querySelector('.palette-import-progress'),'Malformed framed GIF did not report controlled error: '+key);
      assert(editorCount()===29&&JSON.stringify(editorColors())===JSON.stringify(before),'Malformed GIF altered reviewed draft: '+key);
      paletteErrors.push({name:manifest.files[key].name,error:d.querySelector('.palette-editor-error').textContent});
    }
    await closeEditor();await clearWall();await until(()=>d.querySelector('.tiles .example-add'),'Empty-wall example missing');
    const beforeNames=all('.tiles > .tile .name').map(node=>node.textContent),transfer=new w.DataTransfer();
    for(const key of ['malformedShort','malformedIndex'])transfer.items.add(await file(key));
    const node=d.querySelector('input[type=file][multiple]');node.files=transfer.files;node.dispatchEvent(new w.Event('change',{bubbles:true}));
    await until(()=>d.querySelector('.glass-toast')?.textContent.includes('2 files skipped'),'Malformed GIF artwork did not report both rejected files');
    assert(!tile(manifest.files.malformedShort.name)&&!tile(manifest.files.malformedIndex.name),'Malformed artwork appeared on wall');
    assert(JSON.stringify(all('.tiles > .tile .name').map(node=>node.textContent))===JSON.stringify(beforeNames),'Malformed artwork changed empty-wall tiles');
    assert(!all('.tiles .acts button[aria-label^="Remove "]').length&&d.querySelector('.tiles .example-add'),'Malformed artwork displaced the empty-wall example');
    return{paletteErrors,artworkRejected:2,emptyExampleRetained:true};
  });
}
run.onclick=async()=>{if(run.disabled)return;run.disabled=true;artifacts=[];report={kind:'gif-palette',width:innerWidth,touchCapabilityShim:touch,userAgent:navigator.userAgent,started:new Date().toISOString(),checks:[],errors:[]};try{
  manifest=await(await fetch('/manifest')).json();report.privateFixtures=manifest.privateFixtures;report.sourceColors=manifest.colors;await boot(true);
  await check('Fresh Auto settings and exact original GIF artwork count',async()=>{const stored=JSON.parse(w.localStorage.getItem('colorfetti'));assert(stored.family==='full-palette'&&stored.paletteId==='generated-32','Fresh Auto was not selected');assert((stored.maxColors??0)===0&&!stored.cleanup&&(stored.dither??'none')==='none','Fresh conversion settings changed');await add('source');await caption(manifest.files.source.name,29);return{colors:29,frames:manifest.sourceFrames};});
  await check('Auto GIF Save preserves every visible pixel, delay and loop',async()=>({export:await save(manifest.files.source.name)}));
  await check('Original caption and Reuse use whole-clip RGB union',async()=>{click(d.querySelector('.view-toggle'));await caption(manifest.files.source.name,29);assert(d.querySelector('.view-toggle').getAttribute('aria-pressed')==='false','Original toggle failed');click(d.querySelector('.view-toggle'));await caption(manifest.files.source.name,29);await reuse(manifest.files.source.name);await editorReady(29);assert(JSON.stringify(editorColors().sort())===JSON.stringify(manifest.colors),'Reuse RGB set differs');await closeEditor();return{original:29,reuse:29};});
  await check('Source GIF palette import excludes unused slots and includes every frame',async()=>{const result=await paletteFile('source',29);assert(JSON.stringify(result.sort())===JSON.stringify(manifest.colors),'Source import RGB differs');assert(d.querySelector('.palette-import-modal').textContent.includes('Colors from every GIF frame.'),'Whole-animation notice missing');return{colors:29,firstFrameColors:manifest.firstFrameColors.length};});
  await check('Every color → Solid colors → Every color rescans the whole GIF',async()=>{const details=textButton('Find solid colors').closest('details');if(!details.open){click(details.querySelector('summary'));await sleep(0);}click(textButton('Find solid colors'));await sleep(0);await until(()=>!d.querySelector('.palette-import-progress'),'Solid scan did not finish');if(manifest.solidColors.length){assert(editorCount()===manifest.solidColors.length,'Solid color count differs');assert(JSON.stringify(editorColors().sort())===JSON.stringify(manifest.solidColors),'Solid RGB differs');}else assert(editorCount()===29&&d.querySelector('.palette-editor-error'),'Empty solid scan must retain draft and explain');click(textButton('Every color'));await sleep(0);await editorReady(29);assert(JSON.stringify(editorColors().sort())===JSON.stringify(manifest.colors),'Every rescan changed RGB');return{solidColors:manifest.solidColors.length,everyColors:29};});
  await check('Output GIF palette import retains the same 29 visible colors',async()=>{const result=await paletteFile('output',29);assert(JSON.stringify(result.sort())===JSON.stringify(manifest.colors),'Output import RGB differs');return{colors:29};});
  await check('Aseprite imports deduplicate stored entries while preserving raw RGB',async()=>{await paletteFile('sourceAse',31);const source=editorColors();await paletteFile('outputAse',30);const output=editorColors();assert(manifest.colors.every(color=>source.includes(color)&&output.includes(color)),'Aseprite table omits artwork RGB');return{sourceSlots:37,sourceUnique:31,outputSlots:32,outputUnique:30};});
  await check('Existing 51-color HEX remains exact text data',async()=>{await paletteFile('hex',51);return{colors:51};});
  await check('Malformed GIF replacement keeps the reviewed draft',async()=>{const before=editorColors(),transfer=new w.DataTransfer();transfer.items.add(new w.File(['GIF89a invalid frame bytes'],'invalid.gif',{type:'image/gif'}));const node=d.querySelector('.palette-import-modal input[type=file]');node.files=transfer.files;node.dispatchEvent(new w.Event('change',{bubbles:true}));await sleep(0);await until(()=>d.querySelector('.palette-editor-error')&&!d.querySelector('.palette-import-progress'),'Invalid GIF did not report a controlled error');assert(editorCount()===51&&JSON.stringify(editorColors())===JSON.stringify(before),'Failed import replaced the draft');return{retainedColors:51,error:d.querySelector('.palette-editor-error').textContent};});
  await check('Whole-GIF unions above save and review limits remain explicit',async()=>{await paletteFile('overLimit',510);assert(textButton('Save palette').disabled,'510-color union must not save');assert(d.querySelector('.palette-editor-notice')?.textContent.includes('Remove 254'),'Over-256 review notice missing');await paletteFile('overReview',4335);assert(textButton('Save palette').disabled,'Truncated union must not save');assert(d.querySelector('.palette-editor-notice')?.textContent.includes('Only the first 4096'),'4096-color review limit missing');return{overSaveLimit:510,overReviewLimit:4335,displayedReviewLimit:4096};});
  await check('Save imported GIF palette and restore its exact colors after reload',async()=>{await paletteFile('source',29);input(label('Name'),'GIF regression saved');await sleep(0);click(textButton('Save palette'));await until(()=>!d.querySelector('.palette-import-modal[open]'),'Palette save failed');await until(()=>JSON.parse(w.localStorage.getItem('colorfetti-palettes-v1')||'{}').palettes?.some(p=>p.name==='GIF regression saved'),'Palette not persisted');await boot();await rail();const button=label('GIF regression saved');assert(button,'Saved rail entry missing');click(button);click(label('Edit palette'));await editorReady(29);assert(JSON.stringify(editorColors().sort())===JSON.stringify(manifest.colors),'Reloaded palette differs');await closeEditor();await add('source');await caption(manifest.files.source.name,29);return{restoredColors:29,export:await save(manifest.files.source.name)};});
  await check('Max colors cap matches output and returns cleanly to All',async()=>{await select('Auto');await caption(manifest.files.source.name,29);await setCap(8);await until(()=>{const node=tile(manifest.files.source.name)?.querySelector('.caption-color-count');return node&&node.getAttribute('aria-busy')!=='true'&&/^([1-8]) colors?$/.test(node.textContent.trim());},'Cap caption did not settle');const capped=await save(manifest.files.source.name,'cap',8);await setCap(0);await caption(manifest.files.source.name,29);const restored=await save(manifest.files.source.name);return{capped,restored};});
  await check('Single-frame GIF stays exact and saves as PNG',async()=>{await clearWall();await select('Auto');await add('still');await caption(manifest.files.still.name,manifest.stillColors.length);const exported=await save(manifest.files.still.name);assert(exported.name.endsWith('.png'),'Single-frame GIF did not save as still PNG');return{export:exported};});
  await check('Mixed ZIP preserves exact GIF and still PNG',async()=>{await add('source');await caption(manifest.files.source.name,29);const start=artifacts.length;click(label('Save all images'));const zip=await until(()=>artifacts.slice(start).find(value=>value.name&&value.blob.type==='application/zip'),'ZIP not produced');const exports=await verifyArtifact(zip);assert(exports.length===2,'ZIP lost entries');return{exports};});
  await check('1-bit smoke and full-palette return preserve GIF support',async()=>{await rail();click(textButton('1-bit',d.querySelector('.palette-family-tabs')));await until(()=>label('Style'),'1-bit family missing');const exported=await save(manifest.files.source.name,'one-bit',2);await rail();click(textButton('Palette',d.querySelector('.palette-family-tabs')));await until(()=>label('Palette settings'),'Palette family missing on return');await caption(manifest.files.source.name,29);return{export:exported,returnedColors:29};});
  await rasterChecks();await malformedChecks();
  assert(!report.errors.length,'Runtime errors');report.completed=true;status.textContent='PASS — '+report.checks.length+' checks';
}catch(error){report.completed=false;report.failedPhase=phase;report.error={message:error.message,stack:error.stack};status.textContent='FAIL: '+error.message;}finally{report.finished=new Date().toISOString();await publish();run.disabled=false;}};
</script></html>
